<!DOCTYPE html>
<html lang="rn">
<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Admin - Ntugacike Intege</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f4f4;
      color: #222;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: auto;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    h1, h2 {
      margin-bottom: 15px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 15px;
    }

    button {
      border: none;
      padding: 11px 15px;
      border-radius: 9px;
      cursor: pointer;
      margin: 4px;
      font-size: 14px;
    }

    .login-btn {
      width: 100%;
      background: #111;
      color: white;
      padding: 13px;
    }

    .approve {
      background: #198754;
      color: white;
    }

    .reject {
      background: #dc3545;
      color: white;
    }

    .delete {
      background: #111;
      color: white;
    }

    .index-btn {
      background: #2196f3;
      color: white;
    }

    .logout {
      background: #555;
      color: white;
    }

    .message {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .message-text {
      line-height: 1.6;
      margin-bottom: 10px;
    }

    .status {
      font-weight: bold;
      margin-bottom: 10px;
    }

    .approved {
      color: #198754;
    }

    .not-approved {
      color: #dc3545;
    }

    .error {
      background: #ffdede;
      color: #a00000;
      padding: 12px;
      border-radius: 10px;
      margin-top: 10px;
      display: none;
    }

    .success {
      background: #d9f7df;
      color: #146c2e;
      padding: 12px;
      border-radius: 10px;
      margin-top: 10px;
      display: none;
    }

    #dashboard {
      display: none;
    }

    .top-buttons {
      margin-bottom: 15px;
    }

    .empty {
      text-align: center;
      padding: 20px;
      opacity: 0.7;
    }

  </style>

</head>

<body>

<div class="container">

  <!-- LOGIN -->

  <div id="loginCard" class="card">

    <h1>🔐 Admin Login</h1>

    <p style="margin-bottom:15px;">
      Injira ukoresheje email na password ya Admin.
    </p>

    <input
      type="email"
      id="email"
      placeholder="Email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
    >

    <button
      class="login-btn"
      onclick="loginAdmin()"
    >
      🔐 Injira
    </button>

    <div id="loginError" class="error"></div>

  </div>


  <!-- DASHBOARD -->

  <div id="dashboard">

    <div class="card">

      <h1>👨‍💼 Admin Dashboard</h1>

      <p style="margin-bottom:15px;">
        Hano ni ho ucungira ubutumwa bw'abakoresha.
      </p>

      <div class="top-buttons">

        <button
          class="index-btn"
          onclick="goToIndex()"
        >
          🏠 Raba Application
        </button>

        <button
          class="logout"
          onclick="logoutAdmin()"
        >
          🚪 Logout
        </button>

      </div>

    </div>


    <div class="card">

      <h2>💬 Ubutumwa</h2>

      <div id="messages">
        Turiko turazana ubutumwa...
      </div>

    </div>

  </div>

</div>


<script>

  /* =========================================
     SUPABASE
     ========================================= */

const SUPABASE_URL =
  "https://oorngjrspjbjzxtoqjou.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_eQxRIJnKbq6fPWtutstIKA_q7G4U1v1";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );



  


  /* =========================================
     LOGIN
     ========================================= */

  async function loginAdmin() {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;


    const errorBox =
      document.getElementById("loginError");

    errorBox.style.display = "none";


    if (!email || !password) {

      errorBox.textContent =
        "Shiramwo email na password.";

      errorBox.style.display = "block";

      return;
    }


    const {
      data,
      error
    } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });


    if (error) {

      console.error(error);

      errorBox.textContent =
        "Email canke password siyo.";

      errorBox.style.display = "block";

      return;
    }


    if (data.session) {

      showDashboard();

    }

  }


  /* =========================================
     SHOW DASHBOARD
     ========================================= */

  function showDashboard() {

    document.getElementById("loginCard")
      .style.display = "none";

    document.getElementById("dashboard")
      .style.display = "block";

    loadMessages();

  }


  /* =========================================
     CHECK LOGIN
     ========================================= */

  async function checkAdminSession() {

    const {
      data
    } =
      await supabaseClient.auth.getSession();


    if (data.session) {

      showDashboard();

    } else {

      document.getElementById("loginCard")
        .style.display = "block";

      document.getElementById("dashboard")
        .style.display = "none";

    }

  }


  /* =========================================
     LOAD MESSAGES
     ========================================= */

  async function loadMessages() {

    const box =
      document.getElementById("messages");

    box.innerHTML =
      "Turiko turazana ubutumwa...";


    const {
      data,
      error
    } =
      await supabaseClient
        .from("Ubutumwa")
        .select("*")
        .order("created_at", {
          ascending: false
        });


    if (error) {

      console.error(error);

      box.innerHTML =
        '<div class="error" style="display:block;">' +
        'Ntitwashoboye kuzana ubutumwa.' +
        '</div>';

      return;
    }


    if (!data || data.length === 0) {

      box.innerHTML =
        '<div class="empty">' +
        'Nta butumwa buraboneka.' +
        '</div>';

      return;
    }


    box.innerHTML = "";


    data.forEach(item => {

      const div =
        document.createElement("div");

      div.className = "message";


      const text =
        document.createElement("div");

      text.className = "message-text";

      text.textContent =
        item.message || "";


      const status =
        document.createElement("div");

      status.className = "status";


      if (item.approved === true) {

        status.textContent =
          "✅ Vyemejwe";

        status.classList.add(
          "approved"
        );

      } else {

        status.textContent =
          "⏳ Ntibirakwemezwa";

        status.classList.add(
          "not-approved"
        );

      }


      div.appendChild(text);
      div.appendChild(status);


      /* APPROVE */

      const approveBtn =
        document.createElement("button");

      approveBtn.className =
        "approve";

      approveBtn.textContent =
        "✅ Kwemeza";

      approveBtn.onclick =
        function() {

          updateMessage(
            item.id,
            true
          );

        };


      /* REJECT */

      const rejectBtn =
        document.createElement("button");

      rejectBtn.className =
        "reject";

      rejectBtn.textContent =
        "❌ Guhakana";

      rejectBtn.onclick =
        function() {

          updateMessage(
            item.id,
            false
          );

        };


      /* DELETE */

      const deleteBtn =
        document.createElement("button");

      deleteBtn.className =
        "delete";

      deleteBtn.textContent =
        "🗑️ Gusiba";

      deleteBtn.onclick =
        function() {

          deleteMessage(
            item.id
          );

        };


      div.appendChild(approveBtn);
      div.appendChild(rejectBtn);
      div.appendChild(deleteBtn);


      box.appendChild(div);

    });

  }


  /* =========================================
     APPROVE / REJECT
     ========================================= */

  async function updateMessage(
    id,
    approved
  ) {

    const {
      error
    } =
      await supabaseClient
        .from("Ubutumwa")
        .update({
          approved: approved
        })
        .eq("id", id);


    if (error) {

      console.error(error);

      alert(
        "Ntivyashobotse guhindura ubutumwa."
      );

      return;
    }


    loadMessages();

  }


  /* =========================================
     DELETE
     ========================================= */

  async function deleteMessage(id) {

    const confirmDelete =
      confirm(
        "Urashaka gusiba ubu butumwa?"
      );


    if (!confirmDelete) {
      return;
    }


    const {
      error
    } =
      await supabaseClient
        .from("Ubutumwa")
        .delete()
        .eq("id", id);


    if (error) {

      console.error(error);

      alert(
        "Ntivyashobotse gusiba ubutumwa."
      );

      return;
    }


    loadMessages();

  }


  /* =========================================
     GO TO INDEX
     ========================================= */

  function goToIndex() {

    window.location.href =
      "index.html";

  }


  /* =========================================
     LOGOUT
     ========================================= */

  async function logoutAdmin() {

    await supabaseClient.auth.signOut();

    document.getElementById("dashboard")
      .style.display = "none";

    document.getElementById("loginCard")
      .style.display = "block";

    document.getElementById("email")
      .value = "";

    document.getElementById("password")
      .value = "";

  }


  /* =========================================
     START
     ========================================= */

  document.addEventListener(
    "DOMContentLoaded",
    function() {

      checkAdminSession();

    }
  );

</script>

</body>
</html>
