<!DOCTYPE html>

<html lang="rn">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jean Claude Rent Manager</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f2f2f2;
    margin:0;
    padding:20px;
}

h1{
    text-align:center;
    color:#0066cc;
}

.container{
    max-width:500px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
}

input, button{
    width:100%;
    padding:12px;
    margin:5px 0;
    border-radius:5px;
    border:1px solid #ccc;
}

button{
    background:#0066cc;
    color:white;
    border:none;
    cursor:pointer;
}

button:hover{
    background:#004999;
}

.umupangayi{
    background:#eee;
    margin-top:10px;
    padding:10px;
    border-radius:8px;
}
</style>

</head>

<body>


<!-- LOGIN YA BOSI -->
<div class="container">

<h2>🔐 Kwinjira kwa Bosi</h2>

<input id="adminTel" placeholder="Numero ya telefone ya Bosi">

<input id="adminPass" type="password" placeholder="Password">

<button onclick="loginBosi()">
🔑 Injira
</button>

</div>


<!-- PAGE YA BOSI -->
<div id="adminPage" class="container" style="display:none">


<h2>🏠 Kwongeramwo umupangayi</h2>


<input id="izina" placeholder="Izina ry'umupangayi">


<input id="telephone" placeholder="Numero ya telefone">


<input id="inzu" placeholder="Numero y'inzu (A1, A2...)">


<input id="ubukode" type="number" placeholder="Amafaranga y'ubukode">


<input id="amazi" type="number" placeholder="Amafaranga y'amazi">


<input id="amatara" type="number" placeholder="Amafaranga y'amatara">


<input id="itariki" type="date">


<button onclick="bikaUmupangayi()">
💾 Bika umupangayi
</button>



<h2>👥 Abapangayi</h2>

<div id="liste"></div>



<h2>📊 Raporo</h2>

<div id="raporo"></div>

<h2>🏠 Amazu</h2>
<div id="amaz"></div>

<h2>🔔 Notifications</h2>
<div id="notification"></div>


  


</div>



<!-- PAGE Y'UMUPANGAYI -->
<div class="container">


<h2>🔔 Umupangayi</h2>


<input id="tenantTel" placeholder="Shiramwo numero yawe">


<button onclick="rabaUbutumwa()">
📩 Raba ubutumwa
</button>


<div id="tenantMessage"></div>


</div>

  


<script>




let abapangayi = JSON.parse(localStorage.getItem("abapangayi")) || [];


// KUBIKA UMUPANGAYI

function bikaUmupangayi(){

let izina = document.getElementById("izina").value;
let telephone = document.getElementById("telephone").value;
let inzu = document.getElementById("inzu").value;

let ubukode = document.getElementById("ubukode").value;
let amazi = document.getElementById("amazi").value;
let amatara = document.getElementById("amatara").value;

let itariki = document.getElementById("itariki").value;



if(izina=="" || ubukode==""){
    alert("Shiramwo izina n'ubukode");
    return;
}




  
let mushasha = {

izina: izina,
telephone: telephone,
password:"1234",
inzu: inzu,

ubukode:Number(ubukode),
amazi:Number(amazi)||0,
amatara:Number(amatara)||0,

itarikiKwinjira:itariki,
amazeKwishura:0,
yishuye:false

};






  
    


abapangayi.push(mushasha);


kubika();


// Gusukura formulaire

document.getElementById("izina").value="";
document.getElementById("telephone").value="";
document.getElementById("inzu").value="";
document.getElementById("ubukode").value="";
document.getElementById("amazi").value="";
document.getElementById("amatara").value="";
document.getElementById("itariki").value="";
document.getElementById("ukwezi").value="";


alert("Umupangayi yabitswe neza ✅");

}


// KUBIKA LOCALSTORAGE





function kubika(){

    localStorage.setItem(
        "abapangayi",
        JSON.stringify(abapangayi)
    );

    erekanaAbapangayi();
    erekanaRaporo();

    // Genzura ko elements zibaho
    let amazu = document.getElementById("amaz");
    if(amazu){
        erekanaAmazu();
    }

    let notification = document.getElementById("notification");
    if(notification){
        erekanaNotification();
    }

}

  



// KUGARAGAZA ABAPANGAYI

function erekanaAbapangayi(){

let liste=document.getElementById("liste");

liste.innerHTML="";


abapangayi.forEach((p,index)=>{


liste.innerHTML +=`

<div class="umupangayi">

<h3>👤 ${p.izina}</h3>

<p>📞 ${p.telephone}</p>

<p>🏠 Inzu: ${p.inzu}</p>


<p>💰 ${p.ubukode} Fbu</p>


<p>🏠 Ubukode: ${p.ubukode} Fbu</p>

<p>💧 Amazi: ${p.amazi || 0} Fbu</p>

<p>💡 Amatara: ${p.amatara || 0} Fbu</p>

<p>💰 Yose hamwe: ${p.ubukode+(p.amazi||0)+(p.amatara||0)} Fbu</p>



<p>📅 ${p.itarikiKwinjira}</p>



<p>
${p.yishuye ? "✅ Yishuye":"❌ Aragifitiye ideni"}
</p>

<p>💵 Amafaranga yishuye: ${p.amazeKwishura || 0} Fbu</p>

<p>❌ Asigaye kuriha: ${
(
p.ubukode +
(p.amazi || 0) +
(p.amatara || 0)
) - (p.amazeKwishura || 0)
} Fbu</p>




                   


<button onclick="kwishura(${index})">
💵 Yishuye
</button>
<button onclick="menyeshaUmupangayi(${index})">
📲 Menyesha umupangayi
</button>






<button onclick="gusiba(${index})">
🗑 Gusiba
</button>


</div>

`;

});


}




function kwishura(index){

let amafaranga = prompt("Andika amafaranga umupangayi yishuye:");

if(amafaranga == "" || amafaranga == null){
    return;
}

amafaranga = Number(amafaranga);


let p = abapangayi[index];

let total = 
p.ubukode +
(p.amazi || 0) +
(p.amatara || 0);


// Kongera amafaranga yishuwe
p.amazeKwishura = (p.amazeKwishura || 0) + amafaranga;


// Kubara asigaye
let asigaye = total - p.amazeKwishura;


// Kumenya uko ahagaze
let message = "";

if(asigaye <= 0){

    p.yishuye = true;

    message =
    "Murakoze " + p.izina + " 👋\n\n" +
    "Twakiriye amafaranga yawe yose: " +
    p.amazeKwishura +
    " Fbu.\n\n" +
    "✅ Ubukode bw'uku kwezi bwaheze.\n" +
    "Nta mwenda usigaye.";

}else{

    p.yishuye = false;

    message =
    "Murakoze " + p.izina + " 👋\n\n" +
    "Twakiriye amafaranga yawe: " +
    amafaranga +
    " Fbu.\n\n" +
    "💰 Yose warutegerezwa kuriha: " +
    total +
    " Fbu.\n" +
    "💵 Usigaje: " +
    asigaye +
    " Fbu.\n\n" +
    "Turakwibutsa kuzozana amafaranga asigaye kugira ukwezi guhere.";

}


// kubika
kubika();


alert(message);


// Kohereza WhatsApp ku mupangayi

if(p.telephone){

let numero = p.telephone.replace(/\s+/g,'');

let whatsapp =
"https://wa.me/" +
numero +
"?text=" +
encodeURIComponent(message);


window.open(whatsapp,"_blank");

}


}
  


// GUSIBA UMUPANGAYI

function gusiba(index){

if(confirm("Gusiba uyu mupangayi?")){

abapangayi.splice(index,1);

kubika();

}

}



// RAPORO

function erekanaRaporo(){

let amadeni=0;
let bose=0;


abapangayi.forEach(p=>{

if(!p.yishuye){

bose++;
amadeni+=Number(p.ubukode);

}

});


document.getElementById("raporo").innerHTML=`

<h3>❌ Abatarishura: ${bose}</h3>

<h3>💰 Amadeni: ${amadeni} Fbu</h3>

`;

}



// AMAZU

function erekanaAmazu(){

let html="";


abapangayi.forEach(p=>{

html+=`

<div class="umupangayi">

<h3>🏠 ${p.inzu}</h3>

<p>${p.izina}</p>

<p>${p.yishuye?"✅ Yishuye":"❌ Aragifitiye ideni"}</p>

</div>

`;

});


document.getElementById("amaz").innerHTML=html;

}



// NOTIFICATION


function erekanaNotification(){

let message = "";

let uyumusi = new Date();

abapangayi.forEach(function(p){

    if(!p.itarikiKwinjira){
        return;
    }

    let itariki = new Date(p.itarikiKwinjira);

    itariki.setMonth(itariki.getMonth()+1);


    let iminsi = Math.ceil(
        (itariki - uyumusi)/(1000*60*60*24)
    );


    if(iminsi <= 5 && iminsi > 0 && p.yishuye == false){

        message += `
        <div class="umupangayi">
        🔔 <b>Kwibutsa bosi</b><br>
        Umupangayi: ${p.izina}<br>
        Inzu: ${p.inzu}<br>
        Hasigaye iminsi: ${iminsi}<br>
        Amafaranga: ${p.ubukode} Fbu
        </div>
        `;

    }


    if(iminsi <=0 && p.yishuye == false){

        message += `
        <div class="umupangayi">
        ❌ <b>Ubukode bwarengeje igihe</b><br>
        Umupangayi: ${p.izina}<br>
        Inzu: ${p.inzu}<br>
        Aracaririye kuriha.
        </div>
        `;

    }

});


if(message==""){

document.getElementById("notification").innerHTML =
"✅ Nta muntu ararenza igihe co kuriha.";

}else{

document.getElementById("notification").innerHTML = message;

}

}




  



// GUSIBA VYOSE

function gusibaAmakuru(){

if(confirm("Gusiba amakuru yose?")){

localStorage.removeItem("abapangayi");

location.reload();

}

}



// TANGURA

erekanaAbapangayi();
erekanaRaporo();
erekanaAmazu();
erekanaNotification();



// Genzura igihe co kuriha ubukode




// Genzura igihe co kuriha ubukode
function genzuraUbukode(){

    let abapangayi = JSON.parse(localStorage.getItem("abapangayi")) || [];

    let uyumusi = new Date();


    abapangayi.forEach(function(p){

        if(!p.itarikiKwinjira){
            return;
        }


        let itariki = new Date(p.itarikiKwinjira);


        // ukwezi gukurikira co kuriha
        itariki.setMonth(itariki.getMonth() + 1);


        let iminsiIsigaye = Math.ceil(
            (itariki - uyumusi) / (1000 * 60 * 60 * 24)
        );


        if(iminsiIsigaye <= 5 && iminsiIsigaye > 0){

            alert(
            "⚠️ AVERTISSEMENT Y'UBUKODE\n\n" +
            "Umupangayi: " + p.izina +
            "\nInzu: " + p.inzu +
            "\nHasigaye iminsi: " + iminsiIsigaye +
            "\n\nTegura amafaranga yo kuriha ubukode."
            );

        }


        if(iminsiIsigaye <= 0 && p.yishuye == false){

            alert(
            "❌ UBWISHU BWAHEZE\n\n" +
            "Umupangayi: " + p.izina +
            "\nInzu: " + p.inzu +
            "\nAracaririye kuriha ubukode."
            );

        }

    });

}


// Tangura kugenzura iyo app ifunguwe
window.addEventListener("load", function(){

    genzuraUbukode();

});



// MESSAGE Y'UMUPANGAYI
function menyeshaUmupangayi(index){

    let p = abapangayi[index];

    let message =
    "Mwiriwe " + p.izina + " 👋\n\n" +
    "Turakwibutsa ko igihe co kuriha ubukode bw'inzu " +
    p.inzu +
    " carageze.\n\n" +
    "Amafaranga yo kuriha ni: " +
    (p.ubukode + (p.amazi || 0) + (p.amatara || 0)) +
    " Fbu.\n\n" +
    "Turagusavye kwishura ku gihe. Murakoze.";

    
    let numero = p.telephone.replace(/\s+/g,'');


    let whatsapp =
    "https://wa.me/" +
    numero +
    "?text=" +
    encodeURIComponent(message);


    window.open(whatsapp,"_blank");

}


function login(){

let tel=document.getElementById("loginTel").value;
let pass=document.getElementById("password").value;
let role=document.getElementById("role").value;


if(role=="umupangayi"){


let p=abapangayi.find(
(x)=>x.telephone==tel && x.password==pass
);


if(!p){

alert("Telephone canke password siyo");
return;

}



document.getElementById("umupangayiPage").style.display="block";


document.getElementById("messageUmupangayi").innerHTML=`

<div class="umupangayi">

<h3>👤 ${p.izina}</h3>

<p>🏠 Inzu yawe: ${p.inzu}</p>

<p>💰 Ubukode: ${p.ubukode} Fbu</p>

<p>💧 Amazi: ${p.amazi} Fbu</p>

<p>💡 Amatara: ${p.amatara} Fbu</p>


<p>
Amafaranga yose:
${p.ubukode+p.amazi+p.amatara} Fbu
</p>


<p>
${p.yishuye?
"✅ Warishuye uku kwezi":
"❌ Uracaranye ideni"}
</p>


</div>

`;

}



if(role=="bosi"){


if(tel=="admin" && pass=="1234"){


document.getElementById("bosiPage").style.display="block";


let html="";


abapangayi.forEach(p=>{


let ideni =
(p.ubukode+p.amazi+p.amatara)
-
p.amazeKwishura;


if(ideni>0){


html+=`

<div class="umupangayi">

<h3>🏠 Inzu ${p.inzu}</h3>

👤 ${p.izina}<br>

📞 ${p.telephone}<br>


💰 Aheraniwe:
${ideni} Fbu


</div>


`;

}



});


if(html==""){

html="✅ Bose barishuye.";

}


document.getElementById("messageBosi").innerHTML=html;


}

else{

alert("Login ya bosi siyo");

}


}

}



function loginBosi(){

let tel=document.getElementById("adminTel").value;
let pass=document.getElementById("adminPass").value;


if(tel=="admin" && pass=="1234"){


document.getElementById("adminPage").style.display="block";


alert("Murakaza neza Bosi");


}else{

alert("Numero canke password siyo");

}

}





function rabaUbutumwa(){

let tel=document.getElementById("tenantTel").value;


let p=abapangayi.find(
(x)=>x.telephone==tel
);



if(!p){

alert("Numero ntiboneka");
return;

}


// amafaranga yose yo kuriha
let total =
p.ubukode +
(p.amazi || 0) +
(p.amatara || 0);


// amaze kwishura
let yarishe = p.amazeKwishura || 0;


// asigaye
let asigaye = total - yarishe;



// ukwezi aheranye
let ukwezi = "";

if(p.itarikiKwinjira){

let itariki = new Date(p.itarikiKwinjira);

ukwezi = 
(itariki.getMonth()+1) + "/" + itariki.getFullYear();

}else{

ukwezi="Ntikumenyekanye";

}




if(asigaye <= 0){


document.getElementById("tenantMessage").innerHTML=

`
<div class="umupangayi">

<h3>👤 ${p.izina}</h3>

🏠 Inzu: ${p.inzu}<br><br>

📅 Ukwezi aheranye:
<b>${ukwezi}</b><br><br>


💰 Amafaranga yose yo kuriha:
<b>${total} Fbu</b><br><br>


✅ Amafaranga wishuye:
<b>${yarishe} Fbu</b><br><br>


🎉 Nta mwenda usigaye.

</div>
`;



}else{


document.getElementById("tenantMessage").innerHTML=

`
<div class="umupangayi">

<h3>👤 ${p.izina}</h3>

🏠 Inzu: ${p.inzu}<br><br>


📅 Ukwezi aheranye:
<b>${ukwezi}</b><br><br>


💰 Amafaranga yose yo kuriha:
<b>${total} Fbu</b><br><br>


✅ Amafaranga wishuye:
<b>${yarishe} Fbu</b><br><br>


❌ Amafaranga asigaye:
<b>${asigaye} Fbu</b><br><br>


Turagusavye kuzuza ayo usigaje.

</div>
`;

}


}








  

  
</script>

</body>
</html>
